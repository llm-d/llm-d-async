ap:
  imagePullPolicy: Never
  concurrency: 2
  prometheusCacheTTL: "0s"
  transport: redis-sortedset
  transportConfig:
    result_queue_name: "multi-replica-result-list"
    poll_interval_ms: 100
    batch_size: 1
    claim_lease_ttl_seconds: 6
    claim_reclaim_interval_ms: 500
    queues:
      - queue_name: "multi-replica-request-sortedset"
        request_path_url: "/v1/completions"
        igw_base_url: "http://envoy.e2e-integration.svc.cluster.local:8081"
        gate_type: "redis"
        gate_params:
          address: "redis.e2e-integration.svc.cluster.local:6379"
          budget_key: "multi-replica-dispatch-budget"
  metrics:
    enabled: true
    port: 9090
    secure: false
  redis:
    url: "redis://redis.e2e-integration.svc.cluster.local:6379"
  modelServerMonitor:
    enabled: false
